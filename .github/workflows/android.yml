name: Build Quran App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # استخدام النسخة المستقرة كلياً لبناء أندرويد 15

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreproproc-dev libmpdec-dev
        pip install --upgrade pip
        pip install cython virtualenv
        # تثبيت buildozer والتأكد من إضافته للمسار الرئيسي لتجنب خطأ 127
        pip install --user buildozer
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build Android APK
      run: |
        # تشغيل البناء باستخدام المسار المباشر للأداة لضمان التنفيذ الكامل
        yes | $HOME/.local/bin/buildozer -v android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Quran-App
        path: bin/*.apk
