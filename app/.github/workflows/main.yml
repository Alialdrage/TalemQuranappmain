name: build_apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          cache: true

      - name: Install Project Dependencies
        run: |
          flutter config --no-analytics
          cd app
          flutter pub get

      - name: Enforce Gradle Execute Permissions
        run: |
          if [ -f "app/android/gradlew" ]; then
            echo "Gradlew found. Granting execute permissions..."
            chmod +x app/android/gradlew
          else
            echo "Warning: gradlew not found in app/android/ folder."
          fi

      - name: Execute Production Build (APK)
        run: |
          cd app
          flutter build apk --release

      - name: Archive and Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
