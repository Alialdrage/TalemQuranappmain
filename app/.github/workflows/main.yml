import 'package:flutter/material.dart';
import 'package:flutter_localizations/flutter_localizations.dart';

void main() {
  runApp(const ShiaLibraryApp());
}

class ShiaLibraryApp extends StatelessWidget {
  const ShiaLibraryApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'مكتبة الدراسات والكتب الإسلامية',
      localizationsDelegates: const [
        GlobalMaterialLocalizations.delegate,
        GlobalWidgetsLocalizations.delegate,
        GlobalCupertinoLocalizations.delegate,
      ],
      supportedLocales: const [
        Locale('ar', ''),
      ],
      theme: ThemeData(
        useMaterial3: true,
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFF1E3A8A), // أزرق داكن أكاديمي
          primary: const Color(0xFF1E3A8A),
          secondary: const Color(0xFFD97706),
        ),
        scaffoldBackgroundColor: const Color(0xFFF8FAFC),
      ),
      home: const MainHomeScreen(),
    );
  }
}

class MainHomeScreen extends StatefulWidget {
  const MainHomeScreen({super.key});

  @override
  State<MainHomeScreen> createState() => _MainHomeScreenState();
}

class _MainHomeScreenState extends State<MainHomeScreen> {
  // قائمة كتب تخصصية ودراسية
  final List<Book> _books = [
    Book(
      id: '1',
      title: 'نهج البلاغة',
      author: 'الشريف الرضي (جمع)',
      category: 'الحديث والخطب',
      description: 'مجموعة خطب ورسائل وحكم أمير المؤمنين علي بن أبي طالب (ع).',
      content: 'من خطبة له (عليه السلام) وهي المعروفة بالشقشقية:\n\nأَمَا وَاللَّهِ لَقَدْ تَقَمَّصَهَا فُلاَنٌ وَإِنَّهُ لَيَعْلَمُ أَنَّ مَحَلِّي مِنْهَا مَحَلُّ الْقُطْبِ مِنَ الرَّحَى...',
    ),
    Book(
      id: '2',
      title: 'الكافي (الكتاب الأول)',
      author: 'الشيخ الكليني',
      category: 'الحديث والرجال',
      description: 'كتاب العقل والجهل وتوحيد الله جل جلاله.',
      content: 'باب العقل والجهل:\n\nعَنْ أَبِي جَعْفَرٍ (ع) قَالَ: لَمَّا خَلَقَ اللَّهُ الْعَقْلَ اسْتَنْطَقَهُ ثُمَّ قَالَ لَهُ: أَقْبِلْ فَأَقْبَلَ...',
    ),
    Book(
      id: '3',
      title: 'عقائد الإمامية',
      author: 'الشيخ محمّد رضا المظفّر',
      category: 'العقائد والكلام',
      description: 'عرض مختصر وشامل لأهم المبادئ العقائدية لدى الشيعة الإمامية.',
      content: 'عقيدتنا في التوحيد:\n\nنعتقد أن الله تعالى هو الخالق الرازق الموجد لجميع الكائنات، وأن صفاته الذاتية كالعلم والقدرة هي عين ذاته...',
    ),
    Book(
      id: '4',
      title: 'المكاسب',
      author: 'الشيخ مرتضى الأنصاري',
      category: 'الفقه والأصول',
      description: 'كتاب فقهي استدلالي عميق في الأحكام والأنواع المحرمة والمستحبة للتجارة.',
      content: 'كتاب البيع:\n\nالقول في تعريف البيع، وهو في الأصل تمليك عين بمال على وجه التراضي...',
    ),
    Book(
      id: '5',
      title: 'أعيان الشيعة',
      author: 'السيد محسن الأمين',
      category: 'التاريخ والسيرة',
      description: 'موسوعة تراجم وأعلام الشيعة عبر التاريخ.',
      content: 'ترجمة الأعلام والشخصيات التاريخية والرواة مع التحقيق والتفصيل...',
    ),
  ];

  final List<Map<String, dynamic>> _categories = [
    {'title': 'الفقه والأصول', 'icon': Icons.gavel, 'color': const Color(0xFF1E3A8A)},
    {'title': 'العقائد والكلام', 'icon': Icons.menu_book, 'color': const Color(0xFF2563EB)},
    {'title': 'الحديث والرجال', 'icon': Icons.history_edu, 'color': const Color(0xFF0284C7)},
    {'title': 'التاريخ والسيرة', 'icon': Icons.account_balance, 'color': const Color(0xFF0369A1)},
  ];

  String _searchQuery = '';

  @override
  Widget build(BuildContext context) {
    final filteredBooks = _books.where((book) {
      return book.title.contains(_searchQuery) ||
          book.author.contains(_searchQuery) ||
          book.category.contains(_searchQuery);
    }).toList();

    return Scaffold(
      appBar: AppBar(
        title: const Text('المكتبة التخصصية', style: TextStyle(fontWeight: FontWeight.bold)),
        centerTitle: true,
        elevation: 0,
        actions: [
          IconButton(
            icon: const Icon(Icons.bookmark_outline),
            onPressed: () {},
          ),
        ],
      ),
      body: SingleChildScrollView(
        padding: const EdgeInsets.all(16.0),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            // شريط البحث
            TextField(
              onChanged: (value) => setState(() => _searchQuery = value),
              decoration: InputDecoration(
                hintText: 'ابحث عن كتاب، مؤلف، أو موضوع...',
                prefixIcon: const Icon(Icons.search),
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(12),
                  borderSide: BorderSide.none,
                ),
                filled: true,
                fillColor: Colors.white,
              ),
            ),
            const SizedBox(height: 20),

            // الأقسام الرئيسية
            const Text('أقسام المكتبة', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
            const SizedBox(height: 12),
            SizedBox(
              height: 100,
              child: ListView.builder(
                scrollDirection: Axis.horizontal,
                itemCount: _categories.length,
                itemBuilder: (context, index) {
                  final cat = _categories[index];
                  return Container(
                    width: 110,
                    margin: const EdgeInsets.only(left: 12),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: Colors.grey.shade200),
                    ),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        CircleAvatar(
                          backgroundColor: cat['color'].withOpacity(0.1),
                          child: Icon(cat['icon'], color: cat['color']),
                        ),
                        const SizedBox(height: 8),
                        Text(
                          cat['title'],
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w600),
                        ),
                      ],
                    ),
                  );
                },
              ),
            ),
            const SizedBox(height: 24),

            // قائمة المصادر والكتب
            Row(
              mainAxisAlignment: MainAxisAlignment.spaceBetween,
              children: [
                const Text('أبرز المؤلفات والكتب', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                TextButton(onPressed: () {}, child: const Text('عرض الكل')),
              ],
            ),
            const SizedBox(height: 8),

            ListView.builder(
              shrinkWrap: true,
              physics: const NeverScrollableScrollPhysics(),
              itemCount: filteredBooks.length,
              itemBuilder: (context, index) {
                final book = filteredBooks[index];
                return Card(
                  margin: const EdgeInsets.only(bottom: 12),
                  elevation: 0,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(12),
                    side: BorderSide(color: Colors.grey.shade200),
                  ),
                  child: ListTile(
                    contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                    leading: Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Theme.of(context).colorScheme.primary.withOpacity(0.1),
                        borderRadius: BorderRadius.circular(8),
                      ),
                      child: Icon(Icons.book, color: Theme.of(context).colorScheme.primary),
                    ),
                    title: Text(book.title, style: const TextStyle(fontWeight: FontWeight.bold)),
                    subtitle: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const SizedBox(height: 4),
                        Text('المؤلف: ${book.author}', style: TextStyle(color: Colors.grey.shade700, fontSize: 13)),
                        Text('القسم: ${book.category}', style: TextStyle(color: Theme.of(context).colorScheme.primary, fontSize: 11)),
                      ],
                    ),
                    trailing: IconButton(
                      icon: Icon(
                        book.isFavorite ? Icons.favorite : Icons.favorite_border,
                        color: book.isFavorite ? Colors.red : null,
                      ),
                      onPressed: () {
                        setState(() {
                          book.isFavorite = !book.isFavorite;
                        });
                      },
                    ),
                    onTap: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(builder: (context) => BookReaderScreen(book: book)),
                      );
                    },
                  ),
                );
              },
            ),
          ],
        ),
      ),
    );
  }
}

// شاشة عرض المادة والقراءة
class BookReaderScreen extends StatefulWidget {
  final Book book;

  const BookReaderScreen({super.key, required this.book});

  @override
  State<BookReaderScreen> createState() => _BookReaderScreenState();
}

class _BookReaderScreenState extends State<BookReaderScreen> {
  double _fontSize = 18.0;

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(widget.book.title),
        actions: [
          IconButton(
            icon: const Icon(Icons.text_increase),
            onPressed: () => setState(() => _fontSize = (_fontSize + 2).clamp(14.0, 32.0)),
          ),
          IconButton(
            icon: const Icon(Icons.text_decrease),
            onPressed: () => setState(() => _fontSize = (_fontSize - 2).clamp(14.0, 32.0)),
          ),
        ],
      ),
      body: SingleChildScrollView(
        padding: const EdgeInsets.all(20.0),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Container(
              padding: const EdgeInsets.all(12),
              width: double.infinity,
              decoration: BoxDecoration(
                color: Theme.of(context).colorScheme.primary.withOpacity(0.08),
                borderRadius: BorderRadius.circular(8),
              ),
              child: Column(
                children: [
                  Text('المؤلف: ${widget.book.author}', style: const TextStyle(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 4),
                  Text('التصنيف: ${widget.book.category}', style: const TextStyle(fontSize: 12)),
                ],
              ),
            ),
            const SizedBox(height: 20),
            Text(
              widget.book.content,
              style: TextStyle(
                fontSize: _fontSize,
                height: 1.8,
              ),
            ),
          ],
        ),
      ),
    );
  }
}
